<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0B1120" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Animated Shimmer Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9">
        <animate attributeName="stop-opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    @keyframes ping {
      0% { r: 3.5px; opacity: 0.9; }
      70% { r: 9px; opacity: 0; }
      100% { r: 9px; opacity: 0; }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .pulsing-orb {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .ping-ring {
      animation: ping 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: flow 3s linear infinite;
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #F8FAFC;
    }
    .role-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace, -apple-system;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #38BDF8;
      text-transform: uppercase;
    }
    .tag-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #94A3B8;
    }
  </style>

  <!-- Base Card Frame -->
  <rect width="848" height="218" x="1" y="1" rx="14" fill="url(#hero-bg)" stroke="#334155" stroke-width="1.2" />

  <!-- Cyber Grid Overlay -->
  <rect width="846" height="216" x="2" y="2" rx="13" fill="url(#cyber-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="40" r="90" fill="#0284C7" fill-opacity="0.12" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="750" cy="180" r="110" fill="#38BDF8" fill-opacity="0.08" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="450" cy="110" r="80" fill="#6366F1" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Top Accent Glowing Beam -->
  <rect x="2" y="2" width="846" height="3" rx="1.5" fill="url(#shimmer)" filter="url(#subtle-glow)" />

  <!-- Tech Accent Flow Lines -->
  <path d="M 40 185 L 200 185 L 230 205 L 420 205" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.4" class="flow-line" />
  <path d="M 720 30 L 620 30 L 590 15 L 460 15" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.3" class="flow-line" />

  <!-- Status Indicator: Available for Backend Roles -->
  <g transform="translate(620, 24)">
    <rect width="190" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10B981" />
    <circle cx="16" cy="13" class="ping-ring" fill="none" stroke="#10B981" stroke-width="1.5" />
    <text x="28" y="17" font-family="-apple-system, sans-serif" font-size="10px" font-weight="600" fill="#10B981" letter-spacing="0.5px">AVAILABLE FOR ROLES</text>
  </g>

  <!-- Left Visual Code Bracket Motif -->
  <text x="45" y="70" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#38BDF8" fill-opacity="0.35">&lt;dev&gt;</text>

  <!-- Main Hero Identity -->
  <text x="45" y="112" class="name-title">Mani Nakka</text>
  <text x="45" y="138" class="role-title">Software Engineer <tspan fill="#64748B">•</tspan> Backend Developer <tspan fill="#64748B">•</tspan> Product Builder</text>

  <!-- Tech Stack Chips (Visual Pills) -->
  <g transform="translate(45, 160)">
    <!-- Pill 1: Python -->
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="10" cy="12" r="3" fill="#3776AB" />
    <text x="18" y="16" class="tag-text">Python</text>

    <!-- Pill 2: Django -->
    <rect x="78" y="0" width="72" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="88" cy="12" r="3" fill="#092E20" stroke="#10B981" stroke-width="0.8" />
    <text x="96" y="16" class="tag-text">Django</text>

    <!-- Pill 3: DRF -->
    <rect x="158" y="0" width="98" height="24" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
    <circle cx="168" cy="12" r="3" fill="#38BDF8" />
    <text x="176" y="16" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="700" fill="#38BDF8">Django REST</text>

    <!-- Pill 4: PostgreSQL -->
    <rect x="264" y="0" width="92" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="274" cy="12" r="3" fill="#4169E1" />
    <text x="282" y="16" class="tag-text">PostgreSQL</text>

    <!-- Pill 5: AWS -->
    <rect x="364" y="0" width="58" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="374" cy="12" r="3" fill="#FF9900" />
    <text x="382" y="16" class="tag-text">AWS</text>

    <!-- Pill 6: Docker -->
    <rect x="430" y="0" width="72" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="440" cy="12" r="3" fill="#2496ED" />
    <text x="448" y="16" class="tag-text">Docker</text>

    <!-- Pill 7: REST APIs -->
    <rect x="510" y="0" width="86" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="520" cy="12" r="3" fill="#10B981" />
    <text x="528" y="16" class="tag-text">REST APIs</text>
  </g>
</svg>
