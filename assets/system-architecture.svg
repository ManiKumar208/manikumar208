<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="arch-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes packetFlow {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke: #38BDF8;
      stroke-width: 1.5;
      stroke-dasharray: 6, 6;
      animation: packetFlow 2s linear infinite;
    }
    .flow-line-reverse {
      stroke: #818CF8;
      stroke-width: 1.5;
      stroke-dasharray: 6, 6;
      animation: packetFlow 2s linear infinite reverse;
    }
    .sec-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #F8FAFC;
    }
    .sec-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #F8FAFC;
    }
    .card-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #94A3B8;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="848" height="258" x="1" y="1" rx="12" fill="url(#arch-bg)" stroke="#334155" stroke-width="1.2" />
  <rect width="846" height="256" x="2" y="2" rx="11" fill="url(#arch-grid)" />

  <!-- Top Accent Beam -->
  <rect x="2" y="2" width="846" height="3" rx="1.5" fill="url(#glow-cyan)" filter="url(#arch-glow)" />

  <!-- Header -->
  <text x="32" y="32" class="sec-subtitle">Production Architecture Mindset</text>
  <text x="32" y="52" class="sec-title">Modular Backend Systems • Clean Data Flow • Reliable Observability</text>

  <!-- Tier 1: Clients -->
  <rect x="32" y="75" width="130" height="60" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
  <text x="46" y="98" class="card-title">Client Layer</text>
  <text x="46" y="118" class="card-meta">Web / Mobile Apps</text>

  <!-- Flow Line 1 -> 2 -->
  <line x1="162" y1="105" x2="198" y2="105" class="flow-line" />
  <polygon points="198,102 203,105 198,108" fill="#38BDF8" />

  <!-- Tier 2: Gateway & Nginx -->
  <rect x="204" y="75" width="130" height="60" rx="8" fill="url(#card-grad)" stroke="#0284C7" stroke-width="1.2" />
  <text x="218" y="98" class="card-title">Gateway / Proxy</text>
  <text x="218" y="118" class="card-meta">Nginx • SSL • Rate Limit</text>

  <!-- Flow Line 2 -> 3 -->
  <line x1="334" y1="105" x2="370" y2="105" class="flow-line" />
  <polygon points="370,102 375,105 370,108" fill="#38BDF8" />

  <!-- Tier 3: Core App Layer -->
  <rect x="376" y="75" width="160" height="60" rx="8" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.5" />
  <text x="390" y="98" class="card-title">Core Django / DRF</text>
  <text x="390" y="118" class="card-meta">Business Logic • RBAC</text>

  <!-- Flow Line 3 -> 4 (Data) -->
  <line x1="536" y1="95" x2="572" y2="85" class="flow-line" />
  <polygon points="572,82 577,85 572,88" fill="#38BDF8" />

  <!-- Flow Line 3 -> 5 (Cache/Queue) -->
  <line x1="536" y1="115" x2="572" y2="125" class="flow-line-reverse" />
  <polygon points="572,122 577,125 572,128" fill="#818CF8" />

  <!-- Tier 4a: Database -->
  <rect x="578" y="65" width="124" height="42" rx="6" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
  <text x="590" y="84" class="card-title">PostgreSQL</text>
  <text x="590" y="98" class="card-meta">Primary Relational</text>

  <!-- Tier 4b: In-Memory Cache -->
  <rect x="578" y="115" width="124" height="42" rx="6" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
  <text x="590" y="134" class="card-title">Redis Cache</text>
  <text x="590" y="148" class="card-meta">Session &amp; Queues</text>

  <!-- Flow Line 4 -> 5 (Cloud) -->
  <line x1="702" y1="105" x2="734" y2="105" class="flow-line" />
  <polygon points="734,102 739,105 734,108" fill="#38BDF8" />

  <!-- Tier 5: Cloud & Monitoring -->
  <rect x="740" y="75" width="80" height="60" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
  <text x="750" y="98" class="card-title">AWS</text>
  <text x="750" y="118" class="card-meta">Docker • S3</text>

  <!-- Bottom Architecture Metrics / Guarantees -->
  <g transform="translate(32, 175)">
    <rect width="788" height="58" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="0.8" />
    
    <text x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="700" fill="#38BDF8">DATA INTEGRITY</text>
    <text x="24" y="42" font-family="-apple-system, sans-serif" font-size="11px" fill="#94A3B8">Atomic transactions &amp; schema constraints</text>

    <line x1="260" y1="12" x2="260" y2="46" stroke="#1E293B" stroke-width="1" />

    <text x="284" y="24" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="700" fill="#38BDF8">ACCESS CONTROL</text>
    <text x="284" y="42" font-family="-apple-system, sans-serif" font-size="11px" fill="#94A3B8">RBAC &amp; maker-checker approval workflows</text>

    <line x1="530" y1="12" x2="530" y2="46" stroke="#1E293B" stroke-width="1" />

    <text x="554" y="24" font-family="'JetBrains Mono', monospace" font-size="10px" font-weight="700" fill="#38BDF8">RELIABILITY</text>
    <text x="554" y="42" font-family="-apple-system, sans-serif" font-size="11px" fill="#94A3B8">Pytest automation &amp; Docker deployments</text>
  </g>
</svg>
